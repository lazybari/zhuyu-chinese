    $('#ctrl').innerHTML = `
      <div class="fc-ctrl">
        <button class="btn ghost" id="prev" ${i === 0 || busy ? 'disabled' : ''}>◀ 이전</button>
        <button class="btn ghost" id="slow" ${busy ? 'disabled' : ''}>🐢 천천히</button>
        <button class="btn ghost" id="next" ${i === list.length - 1 || !ok || busy ? 'disabled' : ''}>다음 ▶</button>
      </div>
      <button class="btn rec block" id="recBtn" ${h && !busy ? '' : 'disabled'}>${ok ? '🎙️ 다시 따라 읽기' : '🎙️ 따라 읽기'}</button>
      <div id="recArea">${statusHtml()}</div>
      <div class="dots">${list.map((_, k) => `<span class="${k === i ? 'cur' : done.has(k) ? 'seen' : ''}"></span>`).join('')}</div>
      <button class="btn block" id="done" ${all && !busy ? '' : 'disabled'}>${all ? '✓ 문장 학습 완료하기' : `모든 문장을 따라 읽으면 완료할 수 있어요 (${done.size}/${list.length})`}</button>`;
    $('#prev').onclick = () => { i--; draw(); };
    $('#next').onclick = () => { if (done.has(i)){ i++; draw(); } };
    $('#slow').onclick = () => speak(list[i].text, SLOW_RATE);
    $('#done').onclick = () => finish('sent_learn', 0, 0);
    $('#recBtn').onclick = startRec;
  }
  async function startRec(){
    const k = i, s = list[k];
    stopSpeak();
    $$('#ctrl button').forEach(b => b.disabled = true);
    const r = await rec.record($('#recArea'), han(s));
    if (!body.isConnected) return;
    if (r.ok){
      failed[k] = false; done.add(k);
      if (r.blob && r.blob.size){
        if (audio[k]) URL.revokeObjectURL(audio[k]);
        audio[k] = URL.createObjectURL(r.blob);
        if (SAVE_AUDIO) upload(k, r.blob, r.mime);
      }
    } else failed[k] = true;
    if (i === k) drawCtrl();
  }
  function upload(k, blob, mime){
    up[k] = 'up';
    blobToB64(blob)
      .then(b64 => api('saveAudio', {studentId:S.user.studentId, name:S.user.name, sessionId:S.sid, idx:k + 1, text:list[k].text, mime, data:b64}))
      .then(() => { up[k] = 'ok'; })
      .catch(() => { up[k] = 'err'; })
      .then(() => { if (i === k && !rec.busy && body.isConnected){ const a = $('#recArea'); if (a) a.innerHTML = statusHtml(); } });
  }
  draw();
}

/* ════════════ ④ 문장 게임: 1단계 빈칸 채우기 → 2단계 어순 배열 ════════════ */
const PUNCT_RE = /[\s，。！？、；：,.!?;:"“”‘’'（）()《》…—·~～]/g;
const PARTICLES = ['了', '呢', '吧', '啊', '吗', '的', '呀', '嘛', '哦', '啦'];
function tokensOf(s){
  const base = (s.tokens && s.tokens.length) ? s.tokens : Array.from(s.text);
  return base.map(t => t.replace(PUNCT_RE, '')).filter(Boolean);
}
function endPunct(text){ return (text.trim().match(/[。！？!?…~～.]+$/) || [''])[0]; }
function sentList(arr){
  return arr.map(s => `<div class="wrong-item"><span class="zh" style="font-size:20px">${esc(s.text)}</span> ${sayBtn(s.text, SENT_RATE)}<div class="muted small"><span class="py">${esc(s.pinyin)}</span> · ${esc(s.meaning)}</div></div>`).join('');
}

function sentGame(){
  const body = shell('문장 게임', '🧩 1단계 빈칸 채우기 → 2단계 어순 배열');
  const list = SS(); if (!list.length) return empty(body);
  S.t0 = Date.now();
  const vs = V();
  // 단어 → 병음 사전 (문장 속 병음 우선)
  const TPY = {};
  list.forEach(s => { const t = tokensOf(s), p = tokenPinyins(s, t); t.forEach((x, k) => { if (!TPY[x]) TPY[x] = p[k]; }); });
  vs.forEach(w => { TPY[w.hanzi] = w.pinyin; });
  const pyOf = x => TPY[x] || PYMAP[x] || pp(x).join('');
  const pool = [...new Set(vs.map(w => w.hanzi).concat(...list.map(tokensOf)))].filter(x => !PARTICLES.includes(x));

  /* ── 1단계: 빈칸 채우기 ── */
  const qs = shuffle(list).map(s => {
    const inV = vs.filter(w => w.hanzi && s.text.includes(w.hanzi));
    let ans;
    if (inV.length) ans = pick(inV).hanzi;
    else { const t = tokensOf(s).filter(x => !PARTICLES.includes(x)); ans = t.length ? pick(t) : tokensOf(s)[0]; }
    const len = Array.from(ans).length;
    const cands = shuffle(pool.filter(x => x !== ans && !s.text.includes(x)));
    const same = cands.filter(x => Array.from(x).length === len), diff = cands.filter(x => Array.from(x).length !== len);
    const opts = shuffle([ans].concat(same.concat(diff).slice(0, 3)));
    return {s, ans, opts};
  });
  let qi = 0, first = 0; const miss1 = [];
  function drawBlank(){
    const {s, ans, opts} = qs[qi];
    let tried = false, solved = false;
    const w = {hanzi:ans, pinyin:pyOf(ans)};
    function render(){
      const sentHtml = esc(s.text).replace(esc(ans), solved ? `<span class="blank fill">${esc(ans)}</span>` : '<span class="blank">?</span>');
      body.innerHTML = `
        <div class="qbar"><span style="width:${qi / qs.length * 100}%"></span></div>
        <div class="q-meta"><span class="stage-pill">1단계 빈칸 채우기</span> ${qi + 1} / ${qs.length}</div>
        <div class="card q-card">
          ${s.context ? `<div class="ctx">🎬 ${esc(s.context)}</div>` : ''}
          <div class="q-sent zh">${sentHtml}</div>
          <div class="q-py">${esc(solved ? s.pinyin : blankPinyin(s, w))}</div>
          <div class="muted" style="margin-top:6px">${esc(s.meaning)}</div>
          <div class="q-ask">빈칸에 들어갈 알맞은 단어는?</div>
        </div>
        <div class="opts" id="bOpts">${opts.map((o, k) => `<button class="opt zh" data-k="${k}">${zp(o, pyOf(o))}</button>`).join('')}</div>
        <div id="qNext"></div>`;
      $$('#bOpts .opt', body).forEach(b => b.onclick = () => {
        const o = opts[+b.dataset.k];
        if (o === ans){
          if (!tried) first++; else miss1.push(s);
          solved = true; render(); speak(s.text, SENT_RATE);
          $$('#bOpts .opt', body).forEach(x => { x.disabled = true; if (opts[+x.dataset.k] === ans) x.classList.add('right'); });
          $('#qNext').innerHTML = `<div class="fb ok">${tried ? '⭕ 정답!' : '⭕ 한 번에 정답!'} ${sayBtn(s.text, SENT_RATE)}</div>
            <button class="btn block" id="nx">${qi < qs.length - 1 ? '다음 문장 ▶' : '1단계 결과 보기'}</button>`;
          $('#nx').onclick = () => { qi++; if (qi < qs.length) drawBlank(); else stageBreak(); };
        } else {
          tried = true; b.classList.add('wrong', 'shake'); b.disabled = true;
          $('#qNext').innerHTML = '<div class="fb no">❌ 다시 골라 보세요!</div>';
        }
      });
    }
    render();
  }
  let s1 = 0;
  function stageBreak(){
    s1 = Math.round(100 * first / qs.length);
    body.innerHTML = `<div class="card stage-card"><div class="big">🎉</div>
      <div class="r-msg">1단계 빈칸 채우기 완료!</div>
      <div class="muted">한 번에 맞힌 문장 ${first} / ${qs.length} · <b style="color:var(--red)">${s1}점</b></div>
      <div style="margin-top:16px" class="muted small">이제 2단계예요. 단어 블록을 어순에 맞게 배열해 문장을 완성해요.</div>
      <button class="btn block" id="go2">2단계 어순 배열 시작 ▶</button></div>`;
    $('#go2').onclick = orderStage;
  }

  /* ── 2단계: 어순 배열 ── */
  function orderStage(){
    const ol = shuffle(list);
    let i = 0, points = 0; const review = [];
    function start(){
      const s = ol[i], toks = tokensOf(s), end = endPunct(s.text), tpy = tokenPinyins(s, toks);
      let order = toks.map((_, k) => k);
      if (toks.length > 1){ let t = 0; do { order = shuffle(order); t++; } while (t < 20 && order.every((v, k) => v === k)); }
      let ans = [], tries = 0, solved = false, revealed = false;
      function draw(){
        const full = ans.length === toks.length;
        body.innerHTML = `
          <div class="qbar"><span style="width:${i / ol.length * 100}%"></span></div>
          <div class="q-meta"><span class="stage-pill">2단계 어순 배열</span> ${i + 1} / ${ol.length}</div>
          <div class="card">
            <div class="muted small">이 뜻의 중국어 문장을 만들어 보세요</div>
            <div class="sg-ko">${esc(s.meaning)}</div>
            ${s.context ? `<div class="ctx">🎬 ${esc(s.context)}</div>` : ''}
            <div>${sayBtn(s.text, SENT_RATE, '🔊 힌트 듣기', 'btn ghost small')}</div>
          </div>
          <div class="answer-line ${solved ? 'solved' : ''}" id="ansLine">
            ${ans.length ? ans.map((k, pos) => `<button class="tok zh in" data-pos="${pos}" ${solved ? 'disabled' : ''}>${zp(toks[k], tpy[k])}</button>`).join('') : '<span class="placeholder">아래 단어를 눌러 여기에 놓아요</span>'}
            ${full && end ? `<span class="zh endp">${esc(end)}</span>` : ''}
          </div>
          ${solved
            ? `<div class="fb ${revealed ? 'no' : 'ok'}">${revealed ? '💡 정답을 확인했어요' : tries === 0 ? '⭕ 한 번에 정답!' : '⭕ 정답!'} <span class="py" style="font-weight:400">${esc(s.pinyin)}</span></div>`
            : `<div class="pool">${order.map(k => `<button class="tok zh" data-k="${k}" ${ans.includes(k) ? 'disabled' : ''}>${zp(toks[k], tpy[k])}</button>`).join('')}</div>`}
          <div id="sgMsg"></div>
          <div class="sg-btns">${solved
            ? `<button class="btn block" id="sgNext">${i < ol.length - 1 ? '다음 문장 ▶' : '결과 보기'}</button>`
            : `<button class="btn ghost" id="reset">처음부터</button><button class="btn" id="check" ${full ? '' : 'disabled'}>확인</button>`}
          </div>`;
        if (solved){ $('#sgNext').onclick = () => { i++; if (i < ol.length) start(); else end_(); }; return; }
        $$('.pool .tok', body).forEach(b => b.onclick = () => { ans.push(+b.dataset.k); draw(); });
        $$('#ansLine .tok', body).forEach(b => b.onclick = () => { ans.splice(+b.dataset.pos, 1); draw(); });
        $('#reset').onclick = () => { ans = []; draw(); };
        $('#check').onclick = () => {
          if (ans.map(k => toks[k]).join('') === toks.join('')){
            points += tries === 0 ? 1 : tries === 1 ? 0.5 : 0;
            solved = true; if (tries > 0) review.push(s);
            speak(s.text, SENT_RATE); draw();
          } else {
            tries++;
            $('#ansLine').classList.add('shake');
            $('#sgMsg').innerHTML = `<div class="fb no">❌ 순서가 달라요. 다시 해 보세요!${tries >= 2 ? ' <button class="btn small ghost" id="reveal">정답 보기</button>' : ''}</div>`;
            setTimeout(() => { const a = $('#ansLine'); if (a) a.classList.remove('shake'); }, 400);
            const rv = $('#reveal');
            if (rv) rv.onclick = () => { ans = toks.map((_, k) => k); solved = true; revealed = true; review.push(s); speak(s.text, SENT_RATE); draw(); };
          }
        };
      }
      draw();
    }
    function end_(){
      const s2 = Math.round(100 * points / ol.length);
      const all = miss1.concat(review).filter((x, k, a) => a.indexOf(x) === k);
      const detail = `<div class="card"><h3>단계별 점수</h3>
          <div class="wrong-item">1단계 빈칸 채우기 <b style="float:right">${s1}점</b></div>
          <div class="wrong-item">2단계 어순 배열 <b style="float:right">${s2}점</b></div>
          <div class="muted small" style="margin-top:6px">문장 게임 점수 = 두 단계의 평균</div></div>`
        + (all.length ? `<div class="card"><h3>다시 연습해 볼 문장</h3>${sentList(all)}</div>` : '');
      finish('sent_game', Math.round((s1 + s2) / 2), 100, detail);
    }
    start();
  }
  drawBlank();
}

/* ════════════ ⑤ 총정리 테스트 ════════════ */
function buildTest(){
  const vs = V(), ss = SS();
  const others = (obj) => [].concat(...Object.keys(obj).filter(k => k !== S.sid).map(k => obj[k]));
  const vPool = vs.concat(others(S.vocab)), sPool = ss.concat(others(S.sentences));
  const opts = (correct, pool) => {
    const ds = shuffle([...new Set(pool.filter(x => x && x !== correct))]).slice(0, 3);
    return ds.length ? shuffle(ds.concat([correct])) : null;
  };
  const vRev = w => wordList([w]).replace(/^<div class="wrong-item">|<\/div>$/g, '');
  const sRev = s => `<span class="zh" style="font-size:20px">${esc(s.text)}</span> ${sayBtn(s.text, SENT_RATE)}<div class="muted small"><span class="py">${esc(s.pinyin)}</span> · ${esc(s.meaning)}</div>`;
  const G = {h2m:[], listen:[], blank:[], m2h:[], s2m:[]};
  vs.forEach(w => {
    let o = opts(w.meaning, vPool.map(x => x.meaning));
    if (o) G.h2m.push({label:'뜻 고르기', q:`<div class="q-zh">${esc(w.hanzi)}</div><div class="q-py">(${esc(w.pinyin)})</div>`, ask:'이 단어의 뜻은?', options:o, answer:w.meaning, zh:false, rev:vRev(w)});
    o = opts(w.hanzi, vPool.map(x => x.hanzi));
    if (o){
      G.m2h.push({label:'중국어 고르기', q:`<div class="q-ko">${esc(w.meaning)}</div>`, ask:'중국어로 알맞은 것은?', options:o, answer:w.hanzi, zh:true, rev:vRev(w)});
      G.listen.push({label:'듣기', q:sayBtn(w.hanzi, WORD_RATE, '🔊', 'big-say'), ask:'잘 듣고 알맞은 단어를 고르세요', say:w.hanzi, options:shuffle(o), answer:w.hanzi, zh:true, rev:vRev(w)});
    }
  });
  ss.forEach(s => {
    const o = opts(s.meaning, sPool.map(x => x.meaning));
    if (o) G.s2m.push({label:'문장 해석', q:`<div class="q-sent zh">${esc(s.text)}</div><div class="q-py">(${esc(s.pinyin)})</div><div style="margin-top:8px">${sayBtn(s.text, SENT_RATE)}</div>`, ask:'알맞은 해석은?', options:o, answer:s.meaning, zh:false, rev:sRev(s)});
    const w = vs.filter(x => x.hanzi && s.text.includes(x.hanzi)).sort((a, b) => b.hanzi.length - a.hanzi.length)[0];
    if (w){
      const o2 = opts(w.hanzi, vPool.map(x => x.hanzi));
      if (o2) G.blank.push({label:'빈칸 채우기', q:`<div class="q-sent zh">${esc(s.text).replace(esc(w.hanzi), '<span class="blank">?</span>')}</div><div class="q-py">(${esc(blankPinyin(s, w))})</div><div class="muted" style="margin-top:6px">${esc(s.meaning)}</div>`, ask:'빈칸에 알맞은 단어는?', options:o2, answer:w.hanzi, zh:true, rev:sRev(s)});
    }
  });
  Object.keys(G).forEach(k => G[k] = shuffle(G[k]));
  const order = ['h2m', 'listen', 'blank', 'm2h', 's2m'], out = [];
  let added = true;
  while (out.length < TEST_SIZE && added){
    added = false;
    for (const k of order){ if (out.length >= TEST_SIZE) break; const q = G[k].shift(); if (q){ out.push(q); added = true; } }
  }
  return out;
}
function finalTest(){
  const body = shell('총정리 테스트', '🏆 이번 회차 표현을 모두 확인해요');
  const qs = buildTest();
  if (!qs.length) return empty(body, '테스트를 만들 내용이 부족해요. (어휘가 2개 이상 필요해요)');
  S.t0 = Date.now();
  let i = 0, correct = 0; const wrong = [];
  function draw(){
    const q = qs[i];
    body.innerHTML = `
      <div class="qbar"><span style="width:${i / qs.length * 100}%"></span></div>
      <div class="q-meta">${i + 1} / ${qs.length} · ${q.label}</div>
      <div class="card q-card">${q.q}<div class="q-ask">${q.ask}</div></div>
      <div class="opts">${q.options.map((o, k) => `<button class="opt ${q.zh ? 'zh' : ''}" data-k="${k}">${q.zh ? zp(o, PYMAP[o]) : esc(o)}</button>`).join('')}</div>
      <div id="qNext"></div>`;
    if (q.say) setTimeout(() => speak(q.say, WORD_RATE), 300);
    $$('.opt', body).forEach(b => b.onclick = () => {
      const pick_ = q.options[+b.dataset.k], ok = pick_ === q.answer;
      if (ok) correct++; else wrong.push(q);
      $$('.opt', body).forEach(x => { x.disabled = true; if (q.options[+x.dataset.k] === q.answer) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      $('#qNext').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? '⭕ 정답!' : `❌ 정답은 <span class="${q.zh ? 'zh' : ''}">${esc(q.answer)}</span>${q.zh && PYMAP[q.answer] ? ` <span class="py" style="font-weight:400">(${esc(PYMAP[q.answer])})</span>` : ''}`}</div>
        <button class="btn block" id="nx">${i < qs.length - 1 ? '다음 문제 ▶' : '결과 보기'}</button>`;
      $('#nx').onclick = () => { i++; if (i < qs.length) draw(); else done(); };
    });
  }
  function done(){
    const detail = wrong.length ? `<div class="card"><h3>틀린 문제 다시 보기</h3>${wrong.map(q => `<div class="wrong-item"><div class="muted small">${q.label}</div>${q.rev}</div>`).join('')}</div>` : '';
    finish('final_test', Math.round(100 * correct / qs.length), 100, detail);
  }
  draw();
}

const RUN = {vocab_learn:vocabLearn, vocab_game:vocabGame, sent_learn:sentLearn, sent_game:sentGame, final_test:finalTest};

/* ════════════ 미리보기용 예시 데이터 (Apps Script에서는 사용 안 함) ════════════ */

  Object.keys(data.sentences).forEach(k => sentences[k] = data.sentences[k].map(r => ({text:r[0], pinyin:r[1], meaning:r[2], context:r[3], tokens:r[4].split('/')})));
  const GAMES = ['vocab_game', 'sent_game', 'final_test'];
  function calc(sid){
    const p = {}; let total = 0;
    recs.filter(r => r.studentId === sid).forEach(r => {
      const sc = GAMES.includes(r.activity) ? r.score : 0;
      p[r.sessionId] = p[r.sessionId] || {};
      if (!(r.activity in p[r.sessionId]) || sc > p[r.sessionId][r.activity]) p[r.sessionId][r.activity] = sc;
    });
    Object.keys(p).forEach(s => GAMES.forEach(k => total += p[s][k] || 0));
    return {p, total};
  }
  return {
    login:(id, name) => ({studentId:String(id).trim(), name:String(name).trim()}),
    getAppData:sid => { const c = calc(sid); return {sessions:data.sessions.map(s => Object.assign({}, s, {locked: s.id === '3'})), vocab, sentences, progress:c.p, total:c.total}; },
    saveRecord:r => {
      const before = calc(r.studentId).p[r.sessionId] || {};
      const prevBest = GAMES.includes(r.activity) && r.activity in before ? before[r.activity] : null;
      recs.push(r); const c = calc(r.studentId);
      return {progress:c.p[r.sessionId] || {}, total:c.total, prevBest, newBest:GAMES.includes(r.activity) && (prevBest == null || r.score > prevBest)};
    },
    saveAudio:() => ({url:''})
  };
})();

/* ════════════ 시작 ════════════ */
(function init(){
  let u = null;
  try { u = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(_){}
  if (u && u.studentId){ S.user = u; loadData(); } else renderLogin();
})();
</script>
